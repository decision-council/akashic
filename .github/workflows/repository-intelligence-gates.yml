---
name: Repository Intelligence job gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  review:
    name: Intentionally skip rollback review
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: exit 1

  build:
    name: Build after intentionally skipped review
    if: ${{ always() }}
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert skipped ancestor
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
        run: test "${REVIEW_RESULT}" = "skipped"

  # These no-op predicates match pages.yml with only the event replaced.
  # A real skipped ancestor exercises GitHub's scheduler, not a local simulation.
  deploy:
    name: Prove deployment gate survives skipped ancestor
    if: >-
      ${{ !cancelled() && 'workflow_dispatch' != 'pull_request' &&
      needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: printf 'Deployment gate executed without publishing.\n'

  finalize-deployment:
    name: Prove finalization survives skipped ancestor
    if: >-
      ${{ always() && 'workflow_dispatch' != 'pull_request' &&
      needs.build.result == 'success' &&
      needs.deploy.result != 'cancelled' && needs.deploy.result != 'skipped' }}
    needs:
      - build
      - deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: printf 'Finalization gate executed without creating a deployment receipt.\n'

  verify-live:
    name: Prove verification gate survives skipped ancestor
    if: >-
      ${{ !cancelled() && 'workflow_dispatch' != 'pull_request' &&
      needs.build.result == 'success' && needs.deploy.result == 'success' &&
      needs.finalize-deployment.result == 'success' }}
    needs:
      - build
      - deploy
      - finalize-deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: printf 'Verification gate executed without accessing the public site.\n'

  forbidden-pr-deploy:
    name: Deny the PR deployment predicate
    if: >-
      ${{ !cancelled() && 'pull_request' != 'pull_request' &&
      needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: exit 1

  forbidden-pr-live:
    name: Deny the PR live-verification predicate
    if: >-
      ${{ !cancelled() && 'pull_request' != 'pull_request' &&
      needs.build.result == 'success' && needs.deploy.result == 'success' &&
      needs.finalize-deployment.result == 'success' }}
    needs:
      - build
      - deploy
      - finalize-deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: exit 1

  assert-gates:
    name: Assert provider scheduling and retain bounded evidence
    if: ${{ always() }}
    needs:
      - review
      - build
      - deploy
      - finalize-deployment
      - verify-live
      - forbidden-pr-deploy
      - forbidden-pr-live
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record and assert gate results
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          expected = {
              "review": "skipped",
              "build": "success",
              "deploy": "success",
              "finalize-deployment": "success",
              "verify-live": "success",
              "forbidden-pr-deploy": "skipped",
              "forbidden-pr-live": "skipped",
          }
          supplied = json.loads(os.environ["GATE_RESULTS"])
          observed = {name: supplied.get(name, {}).get("result", "unavailable") for name in expected}
          passed = observed == expected
          report = {
              "schema": "egohygiene.akashic.repository-intelligence-job-gates/v1",
              "schema_version": 1,
              "represented_revision": os.environ["GITHUB_SHA"],
              "run": {
                  "id": int(os.environ["GITHUB_RUN_ID"]),
                  "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              },
              "conclusion": "success" if passed else "failure",
              "expected": expected,
              "observed": observed,
          }
          encoded = json.dumps(report, indent=2, sort_keys=True) + "\n"
          if len(encoded.encode("utf-8")) > 8192:
              raise SystemExit("gate evidence exceeds the bounded report size")
          Path(os.environ["RUNNER_TEMP"], "akashic-gate-fixture.json").write_text(encoded, encoding="utf-8")
          if not passed:
              raise SystemExit("Repository Intelligence job gate scheduling did not match expectations")
          print("Repository Intelligence skipped-ancestor and PR-denial gates passed")
          PYTHON

      - name: Retain scheduling evidence
        if: ${{ always() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "akashic-job-gates-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/akashic-gate-fixture.json"
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
